<!DOCTYPE html>
<html dir="rtl" lang="ar">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>SAID MALL</title>
<style>
body{font-family:Tahoma;background:#f5f5f5;padding:20px}
.box{max-width:700px;background:#fff;margin:auto;padding:20px;border-radius:12px;box-shadow:0 2px 12px #bbb}
h1{text-align:center}
input,button{width:100%;padding:12px;margin:6px 0;border-radius:8px;border:1px solid #ccc;font-size:16px}
button{background:#000;color:#fff;font-weight:bold}
table{width:100%;border-collapse:collapse;margin-top:15px}
th,td{border:1px solid #ddd;padding:8px;text-align:center}
th{background:#000;color:#fff}
.total{font-size:22px;font-weight:bold;margin-top:15px;text-align:left}
</style>
</head>
<body>
<div class="box">
<h1>SAID MALL - سنار</h1>
<p style="text-align:center">0914142963</p>
<input id="cust" placeholder="اسم الزبون">
<input id="inv" placeholder="رقم الفاتورة">
<input id="pname" placeholder="اسم المنتج">
<div style="display:flex;gap:6px">
<input id="qty" type="number" placeholder="الكمية">
<input id="price" type="number" placeholder="السعر">
</div>
<button onclick="add()">+ اضافة</button>
<table id="tbl"><tr><th>المنتج</th><th>كمية</th><th>سعر</th><th>مجموع</th></tr></table>
<div class="total" id="gt">المجموع: 0</div>
<button onclick="window.print()" style="background:#25D366;margin-top:20px">🖨️ طباعة الفاتورة</button>
</div>
<script>
let total=0;
function add(){
let n=document.getElementById('pname').value;
let q=parseInt(document.getElementById('qty').value);
let p=parseInt(document.getElementById('price').value);
if(!n||!q||!p)return alert('املأ البيانات');
let t=q*p;total+=t;
document.getElementById('tbl').innerHTML+=`<tr><td>${n}</td><td>${q}</td><td>${p}</td><td>${t}</td></tr>`;
document.getElementById('gt').innerText='المجموع: '+total+' جنيه';
document.getElementById('pname').value='';document.getElementById('qty').value='';document.getElementById('price').value='';
}
</script>
</body>
</html>
